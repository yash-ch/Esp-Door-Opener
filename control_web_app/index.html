<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Servo Control</title>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Servo Control</h2>

    <label for="broker">MQTT Broker</label>
    <input
        type="text"
        id="broker"
        placeholder="wss://broker.hivemq.com:8884/mqtt"
    >

    <label for="topic">MQTT Topic</label>
    <input
        type="text"
        id="topic"
        placeholder="servo/control"
    >

    <label for="angle">Servo Angle</label>
    <input
        type="number"
        id="angle"
        min="0"
        max="180"
        placeholder="90"
    >

    <button onclick="openServo()">
        OPEN
    </button>

    <div id="status">
        Not connected
    </div>

</div>

<script>

    let client = null;

    // -------------------------------
    // Load saved settings
    // -------------------------------

    document.getElementById("broker").value =
        localStorage.getItem("mqttBroker") || "";

    document.getElementById("topic").value =
        localStorage.getItem("mqttTopic") || "";

    document.getElementById("angle").value =
        localStorage.getItem("servoAngle") || "90";


    // -------------------------------
    // Save settings
    // -------------------------------

    function saveSettings() {

        localStorage.setItem(
            "mqttBroker",
            document.getElementById("broker").value
        );

        localStorage.setItem(
            "mqttTopic",
            document.getElementById("topic").value
        );

        localStorage.setItem(
            "servoAngle",
            document.getElementById("angle").value
        );
    }


    // -------------------------------
    // Connect to MQTT
    // -------------------------------

    function connectMQTT() {

        const broker =
            document.getElementById("broker").value.trim();

        if (!broker) {
            setStatus("Enter MQTT broker");
            return false;
        }

        if (client && client.connected) {
            return true;
        }

        setStatus("Connecting...");

        client = mqtt.connect(broker, {
            clientId:
                "servo_web_" +
                Math.random().toString(16).substring(2),

            clean: true,
            connectTimeout: 5000,
            reconnectPeriod: 3000
        });

        client.on("connect", function () {
            setStatus("Connected");
        });

        client.on("error", function (error) {
            console.error(error);
            setStatus("MQTT error");
        });

        client.on("offline", function () {
            setStatus("Offline");
        });

        return true;
    }


    // -------------------------------
    // OPEN button
    // -------------------------------

    function openServo() {

        const broker =
            document.getElementById("broker").value.trim();

        const topic =
            document.getElementById("topic").value.trim();

        const angle =
            Number(document.getElementById("angle").value);

        // Validate

        if (!broker) {
            alert("Enter MQTT broker");
            return;
        }

        if (!topic) {
            alert("Enter MQTT topic");
            return;
        }

        if (isNaN(angle) || angle < 0 || angle > 180) {
            alert("Servo angle must be between 0 and 180");
            return;
        }

        // Store values

        saveSettings();

        // Connect if required

        if (!client || !client.connected) {

            setStatus("Connecting...");

            client = mqtt.connect(broker, {
                clientId:
                    "servo_web_" +
                    Math.random().toString(16).substring(2),

                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 3000
            });

            client.on("connect", function () {

                publishServo(topic, angle);

            });

            client.on("error", function (error) {

                console.error(error);
                setStatus("MQTT error");

            });

        } else {

            publishServo(topic, angle);

        }
    }


    // -------------------------------
    // Publish servo angle
    // -------------------------------

    function publishServo(topic, angle) {

        const payload = String(angle);

        client.publish(
            topic,
            payload,
            {
                qos: 0,
                retain: false
            },
            function (error) {

                if (error) {

                    console.error(error);
                    setStatus("Publish failed");

                } else {

                    setStatus(
                        "OPEN sent: " + angle + "°"
                    );

                }

            }
        );
    }


    // -------------------------------
    // Status
    // -------------------------------

    function setStatus(message) {

        document.getElementById("status").textContent =
            message;

    }

</script>

</body>
</html>
